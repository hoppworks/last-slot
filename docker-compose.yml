services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: lastslot
      POSTGRES_PASSWORD: lastslot
      POSTGRES_USER: lastslot
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastslot -d lastslot"]
      interval: 1s
      timeout: 3s
      retries: 20
  booking-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: booking-service
    environment:
      BOOKING_SERVICE_ADDRESS: 0.0.0.0:50051
      DATABASE_URL: postgres://lastslot:lastslot@postgres:5432/lastslot
      RUST_LOG: booking_service=info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure:5"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: gateway
    environment:
      BOOKING_SERVICE_URL: http://booking-service:50051
      GATEWAY_ADDRESS: 0.0.0.0:8080
      RUST_LOG: gateway=info,tower_http=info
    depends_on:
      - booking-service
    restart: "on-failure:5"

  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "8081:80"
    volumes:
      - ./apps/web/build/web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 20
